# Every push to main builds the launcher's release: the game, the converter and the server packed from a
# clean checkout, the launcher's exe, and both published to the rolling `latest` release that every
# launcher updates itself from. (It used to publish the built game to GitHub Pages as well; that site was
# never used and its deploy failed on every run, so it is gone.)
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A release is only ever made from a clean checkout. Nothing converted from a game install is ever
      # committed, so this can only fail if that rule was broken, and then nothing is built or published.
      - name: No converted content in the checkout
        run: |
          if [ -e assets-private ]; then echo "assets-private is in the checkout; refusing to build a release"; exit 1; fi
          if git ls-files | grep -iE '(^|/)assets-private/|\.(tre|toc|pk3)$'; then echo "game files are tracked; refusing to build a release"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The launcher's release: the pack builds the game again into a folder of its own (Vite's manifest
      # on, the private copy off) and takes only what that build made, then the converter, the server and
      # the launcher proper from git's own list. It fails on anything else.
      - name: Pack the release
        run: node tools/launcher/pack.mjs --ci --out=release --commit=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  # swg3js.exe: Node's own single-executable application with the launcher's bootstrap sealed in. It
  # updates itself from the release below, so a new one is only needed when the bootstrap changes, but
  # it is built every time so the link always hands a friend the newest.
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run launcher:build
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: launcher-build/swg3js.exe
          if-no-files-found: error

  # The Mac launcher, one slice per architecture. A Node binary is built for one of them and a Mac is
  # either, so both are built and joined below. The runners are named rather than left to
  # `macos-latest`, which moves between macOS versions and would silently change what is built.
  #
  # Apple has dropped x86_64 and GitHub retires the last Intel runner in autumn 2027, so the Intel
  # slice is allowed to fail: the job below packs whatever slices arrive, and an Apple silicon only
  # download is a far better outcome than a release that cannot be published at all. When Intel does
  # go, either drop that leg or inject into Node's own darwin-x64 tarball from an arm64 runner --
  # postject only rewrites Mach-O sections, so it does not care which architecture it is editing.
  launcher-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'x64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails loudly if the runner ever stops being the architecture it is named for, rather than
      # quietly publishing two slices of the same kind that lipo would then refuse to join.
      - name: The runner is ${{ matrix.arch }}
        run: |
          got=$(node -p process.arch)
          if [ "$got" != "${{ matrix.arch }}" ]; then echo "expected ${{ matrix.arch }}, this runner is $got"; exit 1; fi
      - run: npm run launcher:build
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: launcher-build/swg3js
          if-no-files-found: error

  # The two slices joined into one universal binary, signed ad-hoc and packed with a double-clickable
  # starter. Done on a Mac because lipo and codesign are only there.
  launcher-macos-universal:
    needs: launcher-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: slices/arm64
      # Best effort: if the Intel leg was skipped or failed there is nothing to download, and the
      # pack below falls back to an Apple silicon only binary rather than failing the release.
      - id: intel
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: slices/x64
      - name: Join, sign and pack
        run: |
          set -euo pipefail
          chmod +x slices/arm64/swg3js
          args="--arm64=slices/arm64/swg3js"
          if [ -f slices/x64/swg3js ]; then
            chmod +x slices/x64/swg3js
            args="$args --x64=slices/x64/swg3js"
          else
            echo "::warning::no Intel slice, so the Mac download is Apple silicon only"
          fi
          node tools/launcher/macos-bundle.mjs $args --out=launcher-build
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: launcher-build/swg3js-macos.tar.gz
          if-no-files-found: error

  # One rolling release, tagged `latest`, always main's newest. The new archive is uploaded beside the
  # old (it is named for its commit), then the exe, then the record that names the archive, and only
  # then are the older archives removed and the tag moved, so a launcher reading the release at any
  # moment finds the archive its record names.
  release:
    needs: [build, launcher, launcher-macos-universal]
    # Only main is ever the release, whichever branch a manual run was started on.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: exe
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: macos
      - name: Publish to the latest release
        run: |
          set -euo pipefail
          archive=$(jq -r .archive.name release/release.json)
          test -f "release/$archive"
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --title "swg3js (main)" \
              --notes "The newest build of main. On Windows download swg3js.exe and run it; on a Mac download swg3js-macos.tar.gz, unpack it and run swg3js (its README.txt says what macOS will ask you). Either keeps itself up to date, converts your own Star Wars Galaxies install on your machine and plays the game in your browser. No game files are in this release."
          fi
          old=$(gh release view latest --json assets --jq '.assets[].name' | grep -E '^swg3js-.*\.tar\.gz$' | grep -vxF "$archive" || true)
          gh release upload latest "release/$archive" --clobber
          gh release upload latest exe/swg3js.exe --clobber
          gh release upload latest macos/swg3js-macos.tar.gz --clobber
          gh release upload latest release/release.json --clobber
          for a in $old; do gh release delete-asset latest "$a" --yes; done
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
